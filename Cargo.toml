[package]
name = "SpotiFrame"
version = "0.1.0"
edition = "2021"

[build-dependencies]
winres = "0.1"

[dependencies]
base64 = "0.22"
eframe = "0.29"
egui = "0.29"
image = { version = "0.25", features = ["jpeg", "png", "gif"] }
open = "5"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tiny_http = "0.12"
url = "2"